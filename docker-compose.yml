# =============================================================================
# docker-compose.yml
# =============================================================================
# Starts the full application stack with a single command:
#
#   docker compose up --build
#
# Services defined here:
#   postgres         — PostgreSQL 16 (app data)
#   backend          — FastAPI application
#   guacd            — Apache Guacamole proxy daemon (RDP → WebSocket)
#   mysql-guacamole  — MySQL (Guacamole auth + connection metadata)
#   guacamole        — Guacamole web application (HTML5 client, port 9080)
#   frontend         — React UI (nginx)
#
# ── How the .env file works ──────────────────────────────────────────────────
# Docker Compose automatically reads a file called .env from the SAME
# directory as this docker-compose.yml (i.e. the project root).
#
# That one root-level .env file serves two purposes at once:
#
#   1. Variable substitution in this YAML file itself.
#      e.g. ${DB_PASSWORD} below is replaced with the value from .env
#      before the YAML is parsed. This is how Postgres gets its password.
#
#   2. env_file: ./.env on the backend service injects the same variables
#      into the container as real environment variables (os.environ).
#      This is how the Python app reads DB_PASSWORD, JWT_SECRET_KEY, etc.
#
# Because BOTH services read from the same single .env file, the password
# Postgres initialises with and the password the backend connects with are
# always identical — no mismatch possible.
#
# Setup (first time):
#   cp .env.example .env          ← copy the template
#   # edit .env and set real values for DB_PASSWORD, JWT_SECRET_KEY, etc.
#   docker compose up --build
#
# Typical workflow:
#   First run:       docker compose up --build
#   Subsequent:      docker compose up
#   Stop:            docker compose down
#   Stop + wipe DB:  docker compose down -v     (-v removes the data volume)
#   Logs:            docker compose logs -f backend
#   Shell in app:    docker compose exec backend bash
# =============================================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine

    container_name: proxmox_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB:       ${DB_NAME:-proxmox_app}
      POSTGRES_USER:     ${DB_USER:-postgres}
      # ${DB_PASSWORD} is read from the root-level .env file by Docker Compose.
      # The :-postgres suffix means "use 'postgres' if DB_PASSWORD is not set".
      # This must match DB_PASSWORD that the backend uses to connect.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-proxmox_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - proxmox_net


  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: proxmox_backend

    restart: unless-stopped

    # Read the root-level .env file into the container as environment variables.
    # This is the SAME file Docker Compose uses for ${...} substitution above,
    # so DB_PASSWORD, JWT_SECRET_KEY, PROXMOX_* etc. are all consistent.
    env_file:
      - ./.env

    environment:
      # These two lines OVERRIDE what's in .env for the backend container only.
      # Inside Docker Compose, containers reach each other by service name —
      # the backend must use "postgres" (the service name) not "localhost".
      DB_HOST: postgres
      DB_PORT: "5432"
      # Apache Guacamole (HTML5 RDP) — same compose stack
      GUACAMOLE_API_URL: http://guacamole:8080/guacamole
      GUACAMOLE_PUBLIC_URL: http://localhost:9080/guacamole
      GUACAMOLE_ADMIN_USER: guacadmin
      GUACAMOLE_ADMIN_PASSWORD: ${GUACAMOLE_ADMIN_PASSWORD:-guacadmin}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        # Do not start the backend until Postgres passes its health check.
        # Prevents "password authentication failed" errors caused by the
        # backend starting before Postgres has finished initialising.
        condition: service_healthy
      guacamole:
        condition: service_started

    networks:
      - proxmox_net

    # Hot-reload in development: mount your local source code so code changes
    # are picked up immediately without a full docker compose up --build.
    # Remove these volumes (and the --reload flag below) for a production deploy.
    volumes:
      - ./backend/app:/home/appuser/app/app
      - ./db:/home/appuser/app/db

    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]


  # ── Apache Guacamole (guacd + MySQL + web app) ─────────────────────────────
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: proxmox_guacd
    restart: unless-stopped
    networks:
      - proxmox_net

  mysql-guacamole:
    image: mysql:8.4
    container_name: proxmox_mysql_guacamole
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${GUACAMOLE_MYSQL_ROOT_PASSWORD:-guacroot}
      MYSQL_DATABASE: guacamole
      MYSQL_USER: guacamole
      MYSQL_PASSWORD: ${GUACAMOLE_MYSQL_PASSWORD:-guacamole}
    volumes:
      - mysql_guacamole_data:/var/lib/mysql
      - ./docker/guacamole/schema:/docker-entrypoint-initdb.d:ro
    networks:
      - proxmox_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 35
      start_period: 60s

  guacamole:
    image: guacamole/guacamole:1.5.5
    container_name: proxmox_guacamole
    restart: unless-stopped
    depends_on:
      mysql-guacamole:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      MYSQL_HOSTNAME: mysql-guacamole
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: guacamole
      MYSQL_USER: guacamole
      MYSQL_PASSWORD: ${GUACAMOLE_MYSQL_PASSWORD:-guacamole}
    ports:
      - "9080:8080"
    networks:
      - proxmox_net


  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: proxmox_frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - proxmox_net


# =============================================================================
# Networks
# =============================================================================
networks:
  proxmox_net:
    driver: bridge


# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  mysql_guacamole_data:
